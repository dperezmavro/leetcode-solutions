edition = "2024"
max_width = 80
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
match_block_trailing_comma = true

# Unstable options. rules_rust registers a nightly rustfmt toolchain, so these
# are honored by both the check aspect (--config=rustfmt) and the in-place
# formatter (bazel run @rules_rust//:rustfmt).
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
wrap_comments = true
comment_width = 80
format_code_in_doc_comments = true
